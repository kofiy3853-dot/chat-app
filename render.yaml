services:
  # Backend Web Service
  - type: web
    name: campus-chat-backend
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install && npm run build:render
    startCommand: npx prisma db push --accept-data-loss && npm start
    envVars:
      # Database (Supabase PostgreSQL)
      - key: DATABASE_URL
        sync: false # Set manually in Render Dashboard
      - key: DIRECT_URL
        sync: false # Set manually in Render Dashboard
      # Supabase Storage
      - key: SUPABASE_URL
        sync: false # Set manually in Render Dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set manually in Render Dashboard
      - key: SUPABASE_ANON_KEY
        sync: false # Set manually in Render Dashboard
      # Server
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://chat-app-kappa-rose.vercel.app
      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      # TURN Server (WebRTC)
      - key: TURN_SERVER_URL
        sync: false # Set manually in Render Dashboard
      - key: TURN_USERNAME
        sync: false # Set manually in Render Dashboard
      - key: TURN_CREDENTIAL
        sync: false # Set manually in Render Dashboard
      # Firebase (Push Notifications)
      - key: FIREBASE_PROJECT_ID
        sync: false # Set manually in Render Dashboard
      - key: FIREBASE_CLIENT_EMAIL
        sync: false # Set manually in Render Dashboard
      - key: FIREBASE_PRIVATE_KEY
        sync: false # Set manually - contains newlines
      # OneSignal (Push Notifications)
      - key: ONESIGNAL_APP_ID
        sync: false # Set manually in Render Dashboard
      - key: ONESIGNAL_REST_API_KEY
        sync: false # Set manually in Render Dashboard
      # AI (Nana)
      - key: OPENAI_API_KEY
        sync: false # Set manually in Render Dashboard
      # Morph AI (Fast Models, Router, Compact, Reflexes)
      - key: MORPH_API_KEY
        sync: false # Set manually in Render Dashboard
      - key: MODERATION_DISABLED
        value: "false"
